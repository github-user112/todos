<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
  // 截图桥接页：/?t=<theme>&d=1 → 写入 localStorage 后跳回首页
  var p = new URLSearchParams(location.search);
  if (p.get('t') !== null) localStorage.setItem('calendar_theme_type', p.get('t'));
  if (p.get('d') === '1') localStorage.setItem('calendar_show_todo_list', '1');
  else localStorage.removeItem('calendar_show_todo_list');
  location.replace('/');
</script>
</body>
</html>
